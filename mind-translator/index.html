<!doctype html>
<html lang="ko">
<head>

<title>마음번역소 | 관계를 번역하는 비주얼 노벨</title>
<style>
:root{--navy:#243554;--ink:#1e293b;--muted:#64748b;--paper:#fffdf8;--orange:#ee9a3d;--gold:#ffd274;--mint:#d8f3ea;--lav:#eadfff;--sky:#d9efff;--rose:#ffe0e3;--line:#e2e8f0;--shadow:0 18px 46px rgba(30,41,59,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#eef2f7}button{font:inherit}
.screen{display:none;min-height:100vh}.screen.on{display:flex}
#home{align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#ffd891,#ef9d3f 55%,#f5bf70)}
.home{width:min(1120px,96vw);background:rgba(255,255,255,.97);border-radius:28px;padding:36px;box-shadow:var(--shadow)}
.badge{display:inline-block;background:#fff0c9;border:1px solid #edc773;border-radius:999px;padding:7px 12px;font-weight:900;color:#714900}
h1{font-size:clamp(48px,7vw,78px);margin:14px 0 8px;letter-spacing:-.055em;line-height:1}h1 span{color:#dc7922}
.lead{font-size:17px;line-height:1.7;color:#566176;max-width:840px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}.rules span{background:#f5f7fa;border:1px solid #e2e8f0;border-radius:10px;padding:7px 9px;font-size:13px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{border:1px solid #dde5ee;background:#fff;border-radius:15px;padding:15px;text-align:left;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);border-color:#e8a14a;box-shadow:0 8px 20px rgba(30,41,59,.08)}.card b{display:block;font-size:18px;margin:4px 0}.card small{color:#dc7922;font-weight:900}.card p{margin:0;color:#6b7280;font-size:13px;line-height:1.45}
#game{flex-direction:column;height:100vh;overflow:hidden}.top{height:66px;flex:0 0 66px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px}.titlemini{font-weight:950}.submini{font-size:11px;opacity:.72}.grow{flex:1}.controls{display:flex;gap:7px}.controls button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:7px 9px;cursor:pointer}.prog{width:min(310px,28vw);display:flex;align-items:center;gap:8px}.track{height:7px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;flex:1}.bar{height:100%;background:linear-gradient(90deg,#ffd274,#8ee0c8);width:0}.pct{font-size:11px;opacity:.75}
.shell{height:calc(100vh - 66px);display:grid;grid-template-columns:minmax(390px,44%) minmax(500px,56%);gap:14px;padding:14px;max-width:1450px;width:100%;margin:auto;overflow:hidden}
.visual{border-radius:20px;background:#17233c;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}.scene{flex:1;min-height:0;border-radius:15px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;padding:22px;background:linear-gradient(180deg,#dcefff,#fff1d8)}.scene.hall{background:linear-gradient(180deg,#d9efff 0 50%,#f5e5c9 50%)}.scene.class{background:linear-gradient(180deg,#fff0c9 0 52%,#d8c5a8 52%)}.scene.chat{background:linear-gradient(150deg,#d9e8ff,#efe7ff)}.scene.gym{background:linear-gradient(180deg,#d8efff 0 50%,#d7b679 50%)}.scene.stage{background:linear-gradient(180deg,#fff2cc 0 56%,#b89570 56%)}.scene.cafe{background:linear-gradient(180deg,#e4f5df 0 52%,#e5c9a6 52%)}
.decor{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(circle at 15% 20%,#fff 0 3px,transparent 4px),radial-gradient(circle at 80% 18%,#fff 0 3px,transparent 4px)}.phone{font-size:100px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.16));margin-bottom:58px}.people{display:flex;gap:46px;align-items:flex-end;z-index:2}.person{display:flex;flex-direction:column;align-items:center;gap:6px}.face{font-size:92px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.15))}.name{background:rgba(255,255,255,.92);padding:5px 10px;border-radius:999px;font-weight:900;font-size:13px}.scene-caption{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.9);padding:7px 10px;border-radius:10px;font-size:12px;font-weight:900;color:#445}
.vinfo{color:#f6f8ff;padding:12px 3px 2px}.vinfo b{font-size:20px;display:block}.vinfo span{font-size:12px;opacity:.7}.skills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.skill{font-size:10px;padding:4px 7px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);border-radius:999px}
.story{background:#fff;border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}.head{padding:15px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.chapter{font-size:12px;font-weight:900;color:#dc7922}.node{margin-left:auto;font-size:11px;font-weight:800;background:#f3f5f8;color:#687386;border-radius:999px;padding:6px 9px}.scroll{flex:1;min-height:0;overflow:auto;padding:19px 21px 24px}.speaker{display:inline-block;background:var(--orange);color:#fff;border-radius:10px;padding:5px 10px;font-weight:900;font-size:13px;margin-bottom:9px}.text{font-size:19px;line-height:1.75;font-weight:720;white-space:pre-line}.thought{margin-top:12px;padding:12px 14px;background:#fff7df;border-left:5px solid #e8b94d;border-radius:9px;color:#655329;font-size:15px;line-height:1.6;font-weight:730}.question{font-size:19px;line-height:1.5;font-weight:950;margin:2px 0 12px}.stagepill{display:inline-block;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950;margin-bottom:9px}.s1{background:#fff0bd;color:#755500}.s2{background:#ead8ff;color:#603b80}.s3{background:#ccf1e8;color:#186d5d}.s4{background:#cfeaff;color:#245f82}
.choices{display:grid;gap:8px}.choice{border:1px solid #dbe3ec;background:#fff;border-radius:13px;padding:12px 13px;text-align:left;cursor:pointer;line-height:1.5;font-size:15px}.choice:hover{background:#fffaf2;border-color:#eaa04c}.choice.selected{border:2px solid #7464c4;background:#f4f1ff}.feedback{margin-top:12px;border-radius:13px;padding:13px 14px;line-height:1.55;font-size:14px;font-weight:750}.feedback.good{background:#e8f8f2;color:#246f5d}.feedback.warn{background:#fff3e3;color:#8a5a1d}.reply{margin-top:10px;padding:13px 14px;border-radius:13px;background:#f4f6f9;border:1px solid #e0e5ed;font-size:16px;line-height:1.6}.nextrow{display:flex;justify-content:flex-end;margin-top:17px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:var(--navy);color:#fff}.soft{background:#fff0c8;color:#6d490c}.lesson{background:linear-gradient(135deg,#fff3ce,#f1ebff);border:1px solid #eadba9;border-radius:15px;padding:16px;margin-top:10px}.lesson b{color:#8b5a06}.lesson p{font-size:16px;line-height:1.65;font-weight:800;margin:6px 0 0}
#result{align-items:center;justify-content:center;padding:22px;background:linear-gradient(145deg,#d8f3eb,#eadfff 48%,#ffe2b4)}.result{width:min(820px,94vw);background:#fff;border-radius:26px;padding:34px;text-align:center;box-shadow:var(--shadow)}.result h2{font-size:36px;margin:8px}.result p{color:#5e697a;line-height:1.65}.compass{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.compass div{padding:11px 6px;border-radius:11px;font-weight:900}.compass div:nth-child(1){background:#fff0bd}.compass div:nth-child(2){background:#ead8ff}.compass div:nth-child(3){background:#ccf1e8}.compass div:nth-child(4){background:#cfeaff}
@media(max-width:980px){#game{height:auto;min-height:100vh;overflow:auto}.shell{height:auto;grid-template-columns:1fr;overflow:visible;max-width:850px}.visual{height:450px}.story{height:650px}.prog{display:none}}
@media(max-width:650px){#home{padding:10px}.home{padding:22px}.grid{grid-template-columns:1fr}h1{font-size:48px}.top{padding:0 8px}.submini{display:none}.visual{height:330px}.story{height:630px}.face{font-size:65px}.people{gap:22px}.phone{font-size:72px}.text{font-size:16px}.question{font-size:17px}.scroll{padding:15px}.controls button{padding:6px}.compass{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="home" class="screen on"><div class="home">
<div class="badge">🧠 맞춤 SOUL FOOD · 대인관계</div>
<h1>마음<span>번역소</span></h1>
<p class="lead">보이는 행동만으로 친구의 마음을 단정하지 않고, 여러 가능성을 생각한 뒤 질문으로 확인하고 관계를 살리는 말을 선택하는 비주얼 노벨입니다. 이야기 속 선택은 정답 맞히기보다 관계를 이해하는 연습입니다.</p>
<div class="rules"><span>👀 사실과 추측 구분하기</span><span>💭 마음을 한 가지로 단정하지 않기</span><span>❓ 질문으로 확인하기</span><span>❤️ 관계를 살리는 말 선택하기</span></div>
<div id="cards" class="grid"></div>
</div></section>
<section id="game" class="screen">
<div class="top"><div><div class="titlemini">🧠 마음번역소</div><div id="mini" class="submini"></div></div><div class="grow"></div><div class="prog"><div class="track"><div id="bar" class="bar"></div></div><div id="pct" class="pct"></div></div><div class="controls"><button id="musicBtn">♪ 음악 ON</button><button id="homeBtn">⌂</button></div></div>
<div class="shell">
<div class="visual"><div id="scene" class="scene"><div class="decor"></div><div id="sceneInner" class="people"></div><div id="sceneCaption" class="scene-caption"></div></div><div class="vinfo"><b id="vtitle"></b><span id="vloc"></span><div class="skills"><span class="skill">관계인식</span><span class="skill">관계관리</span><span class="skill">공감</span><span class="skill">확인 질문</span></div></div></div>
<div class="story"><div class="head"><div><div id="chapter" class="chapter"></div><b id="chapterName"></b></div><div id="node" class="node"></div></div><div id="scroll" class="scroll"></div></div>
</div></section>
<section id="result" class="screen"><div class="result"><div style="font-size:58px">🌿</div><h2>마음번역 완료</h2><p id="resultText"></p><div class="compass"><div>👀 사실 보기</div><div>💭 마음 넓히기</div><div>❓ 질문하기</div><div>❤️ 관계 살리기</div></div><button class="btn primary" onclick="goHome()">다른 이야기 선택하기</button></div></section>
<script>
var CASES=[
{title:"대답 없는 인사",loc:"아침 복도",scene:"hall",a:"민준",b:"서윤",ea:"🙂",eb:"😶",summary:"반갑게 인사했는데 친구가 아무 말 없이 지나갔다.",setup:["아침 8시 35분. 민준은 복도 끝에서 서윤을 발견했다. 어제 함께 웃으며 하교했던 친구였다.","민준은 손을 크게 흔들었다. “서윤아, 안녕!” 그런데 서윤은 민준 쪽을 한번 바라본 뒤 아무 말 없이 교실로 들어갔다.","민준의 손이 천천히 내려왔다. 머릿속에 ‘나를 일부러 무시한 건가?’라는 생각이 가장 먼저 떠올랐다.","하지만 민준이 실제로 본 것은 ‘서윤이 바라봤고, 대답하지 않고 지나갔다’는 것뿐이었다."],c1:{q:"민준이라면 지금 어떤 말을 선택할까요?",o:[["왜 무시해? 내가 뭐 잘못했어?","서윤은 갑작스러운 말에 더 굳어진 표정을 지었다.","서운함을 말할 수 있지만, 이유를 이미 ‘무시’라고 정하면 상대가 방어적으로 느낄 수 있어요.",0],["아까 인사했는데 대답이 없어서 조금 서운했어. 무슨 일 있었어?","서윤이 걸음을 멈추고 민준을 바라보았다.","내 감정은 표현하면서 상대의 이유를 열어 둔 질문이에요.",1],["나도 이제 인사 안 할 거야.","서윤은 민준이 왜 차가워졌는지 알지 못했다.","마음을 숨기면 오해가 계속될 수 있어요.",0]]},mid:["서윤은 잠시 망설이다가 가방 끈을 꼭 잡았다.","민준은 서윤의 얼굴을 다시 보았다. 평소보다 눈이 조금 부어 있었고 말수가 없었다."],c2:{q:"서윤의 마음을 어떻게 생각해 보면 좋을까요?",o:[["분명 민준에게 화가 났을 것이다.","한 가지 이유로 단정하면 다른 가능성을 놓칠 수 있어요.","마음은 보이지 않기 때문에 여러 가능성을 열어 두는 것이 관계인식의 시작이에요.",0],["속상한 일이 있었거나, 생각에 잠겨 인사를 제대로 못 들었을 수도 있다.","민준은 ‘나 때문이 아닐 수도 있겠다’고 생각했다.","하나의 행동에도 여러 이유가 있을 수 있어요.",1],["원래 예의가 없는 친구다.","행동 하나를 사람 전체의 성격으로 판단하게 됩니다.","사람을 낙인찍기보다 상황과 마음을 살펴보세요.",0]]},reveal:["서윤은 작은 목소리로 말했다. “미안해. 오늘 아침에 집에서 키우던 강아지가 많이 아파서 병원에 갔거든. 계속 그 생각만 하고 있었어.”","민준은 순간 마음이 뜨끔했다. 자신을 싫어해서 지나간 것이 아니었다."],end:["“그랬구나. 내가 몰랐어. 많이 걱정되겠다.” 민준이 말했다.","서윤은 그제야 조금 웃었다. “응. 그래도 물어봐 줘서 고마워.”","민준은 알게 되었다. 보이는 행동은 짧지만 그 행동 뒤의 이야기는 훨씬 길 수 있다는 것을."],lesson:"친구의 행동이 나를 향한 것처럼 느껴져도, 먼저 사실과 추측을 나누고 질문으로 확인해 보세요."},
{title:"그냥 내가 할게",loc:"모둠 프로젝트",scene:"class",a:"지우",b:"도현",ea:"🧑‍🎨",eb:"🧑‍💻",summary:"모둠 친구가 갑자기 혼자 정리하겠다고 했다.",setup:["미술과 사회를 함께 하는 모둠 프로젝트 날. 네 명은 발표 자료를 만들고 있었다.","도현은 화면을 한참 보다가 말했다. “됐어. 그냥 내가 할게.” 그리고 노트북을 자기 쪽으로 당겼다.","지우는 순간 기분이 상했다. ‘우리 의견은 필요 없다는 뜻인가?’라는 생각이 들었다.","하지만 도현의 손은 빠르게 움직이면서도 자꾸 멈췄고, 표정에는 화보다 초조함이 더 많이 보였다."],c1:{q:"지우는 어떻게 말을 시작하면 좋을까요?",o:[["왜 네 마음대로 해? 우리도 할 수 있거든.","도현의 어깨가 더 굳었다.","불편함은 말하되 상대를 공격하면 협력의 문이 닫힐 수 있어요.",0],["네가 혼자 하겠다고 해서 조금 당황했어. 혹시 시간이 부족해서 걱정되는 거야?","도현이 손을 멈추었다.","행동의 이유를 묻는 열린 질문은 갈등을 대화로 바꿔요.",1],["그래, 네가 다 해.","도현은 혼자 작업을 계속했고 모둠은 점점 멀어졌다.","관계를 포기하면 역할과 책임도 함께 사라질 수 있어요.",0]]},mid:["도현은 한숨을 쉬었다. “사실 오늘 안에 끝내야 한다는 생각 때문에 너무 급했어.”","지우는 ‘우리를 못 믿어서’가 아니라 ‘시간이 부족할까 봐’ 혼자 떠안으려 했다는 것을 알게 되었다."],c2:{q:"이제 모둠은 어떤 선택을 하면 좋을까요?",o:[["도현이 잘하니까 그대로 혼자 맡긴다.","일은 빨리 끝날 수 있지만 도현의 부담과 모둠의 참여는 남습니다.","협력은 결과뿐 아니라 역할과 책임을 함께 나누는 과정이에요.",0],["해야 할 일을 작은 역할로 나누고, 어려운 부분은 서로 확인한다.","도현의 표정이 조금 편안해졌다.","책임을 나누면 서로를 믿는 경험도 함께 쌓여요.",1],["누가 잘못했는지 먼저 따진다.","모둠의 시간은 잘잘못을 가리는 데 쓰이기 시작했다.","문제 해결을 위해서는 현재 필요한 행동에 집중하는 것도 중요해요.",0]]},reveal:["도현은 말했다. “내가 다 해야 마음이 놓이는 습관이 있나 봐. 사실 혼자 하려니까 더 막막했어.”","지우도 고개를 끄덕였다. “나도 네가 우리를 무시한다고 생각했어. 물어보길 잘했다.”"],end:["한 명은 자료를 찾고, 한 명은 문장을 다듬고, 한 명은 디자인을 맡았다. 도현은 전체를 연결했다.","발표가 끝났을 때 도현은 말했다. “혼자 했으면 이렇게 못 만들었을 것 같아.”","협력은 일을 나누는 것만이 아니라 서로의 걱정까지 나누는 일이었다."],lesson:"상대의 통제적인 행동 뒤에도 불안이나 부담이 있을 수 있습니다. 확인하고 역할을 함께 나누면 관계와 책임감이 함께 자랍니다."},
{title:"읽음만 남은 단체 채팅",loc:"방과 후 단체 채팅방",scene:"chat",a:"수아",b:"친구들",ea:"📱",eb:"💬",summary:"준비물을 물었는데 세 명이 읽고도 답하지 않았다.",setup:["수아는 집에 돌아와 가방을 정리하다가 내일 준비물이 기억나지 않았다.","단체 채팅방에 ‘내일 준비물 뭐 가져가야 하는지 아는 사람?’이라고 보냈다.","잠시 뒤 숫자는 사라졌다. 세 명이 메시지를 읽었다. 그런데 답은 오지 않았다.","수아는 휴대폰을 내려놓았다가 다시 집어 들었다. ‘내 질문은 별로 중요하지 않은가 봐.’라는 생각이 들었다."],c1:{q:"수아가 다음에 보낼 메시지로 더 적절한 것은?",o:[["다 읽고 왜 아무도 답 안 해?","채팅방이 갑자기 조용해졌다.","문자로는 말투와 상황이 보이지 않아 비난으로 느껴질 수 있어요.",0],["혹시 지금 바쁘면 나중에 알려줘도 괜찮아! 기억나는 사람 있으면 부탁해 🙂","잠시 뒤 한 친구가 답장을 쓰기 시작했다.","상대의 상황을 열어 두면서 필요한 도움을 분명히 요청했어요.",1],["됐어. 아무한테도 안 물어볼래.","수아의 서운함은 혼자 남았다.","마음을 닫기보다 필요한 것을 차분히 표현하는 연습이 도움이 됩니다.",0]]},mid:["‘미안! 학원 차 타느라 읽기만 했어. 준비물은 색종이랑 가위래.’ 답장이 왔다.","다른 친구도 ‘나는 엄마가 불러서 바로 답 못 했어’라고 말했다."],c2:{q:"수아는 이 상황에서 무엇을 배울 수 있을까요?",o:[["읽음 표시가 곧 ‘무시했다’는 뜻은 아니다.","수아는 읽음 표시와 친구의 의도를 구분해 보았다.","디지털 상황에서는 보이지 않는 맥락이 더 많아요.",1],["답이 늦으면 친하지 않은 것이다.","관계를 한 번의 반응 속도로 판단하게 됩니다.","관계는 하나의 메시지보다 훨씬 많은 경험으로 이루어져 있어요.",0],["앞으로 질문을 하지 않는 것이 안전하다.","도움을 요청할 기회를 스스로 줄이게 됩니다.","필요한 도움을 적절히 요청하는 것도 중요한 사회정서기술이에요.",0]]},reveal:["친구들은 수아를 무시하려던 것이 아니었다. 각자 이동 중이거나 부모님의 부름을 받고 있었다.","수아는 화면에 보이는 ‘읽음’만으로는 친구들의 상황을 알 수 없다는 것을 깨달았다."],end:["다음 날 수아는 친구에게 말했다. “어제 알려줘서 고마워. 나 혼자 괜히 서운해질 뻔했어.”","친구는 웃으며 말했다. “나도 읽고 답 못 하면 오해할 수 있다는 걸 알았어.”","온라인에서도 관계를 살리는 방법은 같았다. 단정하기보다 확인하고, 필요한 마음을 말로 표현하는 것."],lesson:"디지털 공간에서는 표정과 상황이 보이지 않습니다. ‘읽음=무시’처럼 해석하지 말고 필요한 도움과 마음을 분명하게 표현해 보세요."},
{title:"마지막으로 불린 이름",loc:"체육 시간",scene:"gym",a:"준호",b:"민재",ea:"🏃",eb:"⚽",summary:"팀을 정할 때 준호의 이름이 마지막에 불렸다.",setup:["체육 시간, 반을 두 팀으로 나누기 위해 대표 두 명이 번갈아 친구 이름을 불렀다.","친구들이 하나씩 이동했고, 운동장 가운데에는 준호만 남았다.","“준호는 우리 팀.” 마지막으로 이름이 불렸다. 준호는 아무 말 없이 팀 쪽으로 걸어갔다.","준호는 ‘아무도 나랑 같은 팀을 하고 싶지 않았나 봐’라고 생각했다. 발끝만 보고 있으니 친구들의 표정은 보이지 않았다."],c1:{q:"같은 팀 민재라면 준호에게 어떻게 말을 걸면 좋을까요?",o:[["괜찮아, 어차피 한 명은 마지막이야.","준호는 위로받는 느낌보다 자신의 속상함이 작아진 느낌을 받았다.","감정을 없애려 하기보다 먼저 알아주는 말이 도움이 돼요.",0],["마지막에 불려서 좀 속상했을 것 같아. 괜찮아?","준호가 처음으로 민재를 바라보았다.","상대의 감정을 조심스럽게 짚고 확인하는 표현이에요.",1],["신경 쓰지 마. 경기나 하자.","준호는 말없이 고개만 끄덕였다.","감정을 지나치면 참여할 마음도 함께 줄어들 수 있어요.",0]]},mid:["준호는 작게 말했다. “응, 조금. 내가 운동을 잘 못해서 그런가 싶었어.”","민재는 잠시 생각했다. 준호는 빠르게 뛰지는 않지만 공의 위치를 잘 보고 친구들에게 알려주는 편이었다."],c2:{q:"민재가 팀 안에서 할 수 있는 행동은?",o:[["준호가 잘할 수 있는 역할을 함께 찾아본다.","민재는 준호에게 수비 위치를 보는 역할을 제안했다.","강점을 발견하고 역할을 연결하면 소속감과 책임감이 함께 커집니다.",1],["실수하지 않도록 공을 주지 않는다.","준호는 경기에서 점점 더 멀어졌다.","보호처럼 보여도 참여 기회를 빼앗을 수 있어요.",0],["잘하는 친구들끼리만 작전을 짠다.","경기는 편할 수 있지만 팀의 일부는 소외됩니다.","공동체는 모두가 기여할 자리를 만들 때 강해져요.",0]]},reveal:["대표가 준호를 마지막에 부른 이유는 ‘싫어서’가 아니었다. 공격이 강한 친구를 먼저 고르다 보니 순서가 그렇게 된 것이었다.","하지만 준호가 느낀 서운함도 진짜였다. 사실을 확인한다고 감정이 사라지는 것은 아니었다."],end:["경기 중 준호가 “뒤에 비었어!”라고 외친 덕분에 팀은 실점을 막았다.","민재가 엄지를 들었다. “준호야, 네가 위치 진짜 잘 본다.”","준호는 다음 작전 회의에서 먼저 의견을 냈다. 소속감은 ‘뽑힌 순서’보다 ‘내가 필요한 사람이라는 경험’에서 더 크게 자랐다."],lesson:"상대의 감정을 인정한 뒤 강점과 역할을 연결해 주세요. 관계관리는 위로에서 끝나지 않고 함께 참여할 자리를 만드는 데까지 이어집니다."},
{title:"괜찮았어의 진짜 뜻",loc:"발표가 끝난 교실",scene:"stage",a:"지민",b:"하린",ea:"🎤",eb:"🙂",summary:"발표 소감을 물었더니 친구가 잠시 멈춘 뒤 ‘괜찮았어’라고 말했다.",setup:["지민은 며칠 동안 준비한 발표를 마쳤다. 심장이 아직 빠르게 뛰고 있었다.","자리로 돌아오며 가장 친한 하린에게 물었다. “내 발표 어땠어?”","하린은 잠시 멈췄다가 말했다. “음… 괜찮았어.”","지민은 그 짧은 침묵이 자꾸 마음에 걸렸다. ‘사실 별로였는데 좋게 말해 준 건가?’라는 생각이 들었다."],c1:{q:"지민이 하린의 말을 확인하려면?",o:[["별로였지? 표정 보니까 다 알아.","하린은 당황해서 바로 대답하지 못했다.","상대의 마음을 이미 결정한 질문은 솔직한 대화를 어렵게 만들 수 있어요.",0],["고마워. 혹시 좋았던 점이랑 더 고치면 좋을 점 하나씩 말해 줄래?","하린의 표정이 편안해졌다.","구체적이고 열린 질문은 상대가 솔직하면서도 배려 있게 말할 수 있게 해요.",1],["됐어. 말 안 해도 알아.","지민은 혼자 추측을 이어 갔다.","확인하지 않은 마음은 오해로 굳어질 수 있어요.",0]]},mid:["하린은 말했다. “도입에서 사진 보여 준 건 진짜 좋았어. 그런데 뒤쪽은 조금 빨라서 내가 따라가기 어려웠어.”","지민은 처음에는 얼굴이 뜨거워졌지만, 하린이 발표를 자세히 들었다는 것도 알게 되었다."],c2:{q:"피드백을 들은 지민이 자기 마음을 건강하게 다루는 방법은?",o:[["‘난 발표를 못해’라고 결론 내린다.","한 부분의 아쉬움을 자기 전체에 대한 평가로 바꾸게 됩니다.","실수와 나 자신을 분리해서 바라보는 자기인식이 필요해요.",0],["아쉬운 마음을 인정하고, 다음에는 속도를 조절해 보겠다고 정한다.","지민은 메모장에 ‘뒤쪽 천천히’라고 적었다.","감정을 알아차리고 다음 행동으로 연결하는 것은 자기관리이기도 합니다.",1],["다시는 하린에게 의견을 묻지 않는다.","불편한 감정을 피할 수 있지만 성장의 기회도 줄어듭니다.","안전한 관계에서는 솔직한 피드백도 서로를 돕는 방법이 될 수 있어요.",0]]},reveal:["하린이 처음 망설인 것은 지민의 발표가 싫어서가 아니었다. 친한 친구에게 아쉬운 점을 말하면 상처받을까 걱정되었기 때문이었다.","지민도 ‘괜찮았어’라는 한마디 뒤에 배려와 고민이 함께 있었다는 것을 알게 되었다."],end:["지민은 말했다. “솔직하게 말해 줘서 고마워. 조금 아쉽긴 한데 다음에는 더 잘할 수 있을 것 같아.”","하린은 웃었다. “다음 발표 연습할 때 내가 시간 재 줄까?”","좋은 관계는 좋은 말만 주고받는 관계가 아니라, 서로의 성장을 안전하게 도울 수 있는 관계였다."],lesson:"애매한 말의 의미를 추측으로 채우지 말고 구체적으로 물어보세요. 솔직함과 배려가 함께 있을 때 피드백은 관계를 깊게 만듭니다."},
{title:"달라진 점심 자리",loc:"점심시간 급식실",scene:"cafe",a:"유나",b:"소희",ea:"🍱",eb:"🥄",summary:"늘 같이 앉던 친구가 오늘은 다른 친구 옆에 앉았다.",setup:["유나와 소희는 거의 매일 같은 자리에서 점심을 먹었다.","그런데 오늘 소희는 먼저 급식실에 들어가 다른 친구 옆에 앉았다. 유나와 눈이 마주쳤지만 곧 고개를 돌렸다.","유나는 빈자리를 보며 서운해졌다. ‘이제 나랑 같이 있기 싫은 건가?’라는 생각이 들었다.","점심 한 끼의 자리였지만, 유나에게는 자신의 자리가 사라진 것처럼 느껴졌다."],c1:{q:"유나는 소희에게 어떻게 마음을 전하면 좋을까요?",o:[["나 빼고 재밌게 먹어.","소희는 유나가 화난 이유를 정확히 알 수 없었다.","비꼬는 말은 마음을 숨기면서 상대에게 알아맞히라고 요구하게 돼요.",0],["오늘 다른 데 앉아서 조금 서운했어. 혹시 무슨 일 있었어?","소희가 유나 옆으로 조금 다가왔다.","내 감정을 말하되 상대의 이유는 질문으로 남겨 둔 표현이에요.",1],["아무 말도 하지 않고 다른 친구와 일부러 더 크게 웃는다.","서로의 마음을 확인할 기회가 사라졌다.","관계를 시험하기보다 직접 표현하는 편이 안전해요.",0]]},mid:["소희는 말했다. “미안해. 전학 온 다연이가 계속 혼자 먹어서 오늘만 옆에 앉아 주고 싶었어.”","유나는 안도하면서도 조금 복잡했다. 이유를 알았다고 해서 서운함이 즉시 없어지는 것은 아니었다."],c2:{q:"유나가 자신의 마음과 관계를 함께 돌보는 선택은?",o:[["서운했다고 솔직히 말하고, 다음에는 미리 알려 달라고 부탁한다.","소희는 고개를 끄덕이며 “그럴게”라고 답했다.","나의 필요를 구체적으로 표현하면 상대도 관계를 돌볼 방법을 알 수 있어요.",1],["앞으로 소희가 다른 친구와 놀지 못하게 한다.","불안은 줄어들 수 있지만 친구의 관계를 통제하게 됩니다.","친밀함과 소유는 다릅니다. 좋은 관계는 서로의 다른 관계도 존중해요.",0],["괜찮다고 말하고 속으로만 계속 화낸다.","겉으로는 조용하지만 서운함이 쌓일 수 있습니다.","감정을 안전하게 표현하는 것이 관계관리의 중요한 부분이에요.",0]]},reveal:["소희는 유나를 밀어내려던 것이 아니라 혼자인 친구를 챙기고 싶었다.","유나는 ‘소희에게 새로운 친구가 생기는 것’과 ‘나의 자리가 없어지는 것’은 같은 뜻이 아니라는 것을 배웠다."],end:["다음 날 세 사람은 같은 테이블에 앉았다. 처음에는 조금 어색했지만 다연이가 웃으며 좋아하는 책 이야기를 꺼냈다.","유나는 생각했다. ‘친구가 다른 사람을 챙긴다고 해서 나와의 관계가 작아지는 건 아니구나.’","관계는 자리를 지키는 일이 아니라 서로의 마음을 확인하며 더 넓어질 수도 있는 것이었다."],lesson:"서운함을 숨기거나 상대를 통제하지 말고, 내 마음과 필요한 것을 구체적으로 말해 보세요. 안전한 관계는 서로의 관계가 넓어지는 것도 받아들일 수 있습니다."}
];

var current=0,flow=[],pos=0,score=0,audio=null,music=true;

 var f=[];
 c.setup.forEach(function(t,i){f.push({type:"story",chapter:"이야기",name:"장면 "+(i+1),speaker:i==0?"Narrator":c.a,text:t,thought:i==c.setup.length-1?"첫 생각은 사실일까요, 아니면 아직 확인하지 않은 추측일까요?":""})});
 f.push({type:"choice",chapter:"대화 선택",name:"말 한마디의 방향",speaker:c.a,q:c.c1.q,data:c.c1});
 c.mid.forEach(function(t,i){f.push({type:"story",chapter:"이야기",name:"마음의 단서",speaker:i==0?c.b:"Narrator",text:t})});
 f.push({type:"choice",chapter:"관점 바꾸기",name:"한 가지 마음으로 단정하지 않기",speaker:"마음번역소",q:c.c2.q,data:c.c2});
 f.push({type:"translate",stage:1,title:"👀 보이는 사실",q:"지금까지 실제로 보고 들은 사실과, 내가 덧붙인 해석을 구분해 보세요.",o:["행동과 말처럼 직접 확인한 것부터 말한다.","상대가 나를 싫어한다는 생각을 사실로 적는다.","친구의 성격을 먼저 판단한다."],best:0,fb:"사실은 카메라로 찍을 수 있을 만큼 구체적인 행동과 말입니다. 마음과 의도는 아직 확인이 필요해요."});
 f.push({type:"translate",stage:2,title:"💭 예상되는 마음",q:"상대의 마음을 이해할 때 가장 중요한 태도는 무엇일까요?",o:["가능한 이유를 두세 가지로 열어 둔다.","가장 먼저 떠오른 이유가 맞다고 믿는다.","내 기분과 같은 마음일 것이라고 생각한다."],best:0,fb:"관계인식은 상대의 관점이 내 생각과 다를 수 있음을 인정하는 데서 시작합니다."});
 f.push({type:"translate",stage:3,title:"❓ 확인 질문",q:"마음을 확인하는 질문의 특징은 무엇일까요?",o:["‘혹시’, ‘무슨 일’, ‘어떻게 느꼈어?’처럼 답을 열어 둔다.","‘너 나 싫어하지?’처럼 정답을 정해 두고 묻는다.","질문하지 않고 친구들이 대신 판단하게 한다."],best:0,fb:"좋은 확인 질문은 상대가 자기 이야기를 스스로 설명할 공간을 줍니다."});
 f.push({type:"translate",stage:4,title:"❤️ 관계를 살리는 말",q:"상대의 이야기를 들은 뒤 가장 먼저 할 일은?",o:["이해한 마음을 말로 되돌려 주고 필요한 행동을 함께 찾는다.","누가 더 잘못했는지 결론 낸다.","내가 맞았다는 점을 다시 강조한다."],best:0,fb:"공감은 동의와 다릅니다. 상대의 마음을 이해한 뒤 서로 필요한 행동을 찾는 것이 관계관리입니다."});
 c.reveal.forEach(function(t,i){f.push({type:"story",chapter:"마음 공개",name:"보이지 않았던 이야기",speaker:i==0?c.b:"Narrator",text:t,thought:i==0?"행동만 보았을 때는 알 수 없었던 이야기가 드러났습니다.":""})});
 c.end.forEach(function(t,i){f.push({type:"story",chapter:"에필로그",name:"관계를 다시 잇기",speaker:i==0?c.a:(i==1?c.b:"Narrator"),text:t})});

function start(i){current=i;flow=build(CASES[i]);pos=0;score=0;show("game");if(music)startMusic();render()}
function render(){
 var c=CASES[current],n=flow[pos];document.getElementById("mini").textContent=c.title+" · "+c.loc;document.getElementById("vtitle").textContent=c.title;document.getElementById("vloc").textContent=c.loc;document.getElementById("scene").className="scene "+c.scene;document.getElementById("sceneCaption").textContent=c.loc;
 var inner=document.getElementById("sceneInner");
 if(c.scene=="chat"){inner.innerHTML='<div class="phone">📱</div>'}else{inner.innerHTML='<div class="person"><div class="face">'+c.ea+'</div><div class="name">'+c.a+'</div></div><div class="person"><div class="face">'+c.eb+'</div><div class="name">'+c.b+'</div></div>'}
 document.getElementById("chapter").textContent=n.chapter||"";document.getElementById("chapterName").textContent=n.name||"";document.getElementById("node").textContent=(pos+1)+" / "+flow.length;document.getElementById("bar").style.width=((pos+1)/flow.length*100)+"%";document.getElementById("pct").textContent=Math.round((pos+1)/flow.length*100)+"%";
 var s=document.getElementById("scroll");s.scrollTop=0;s.innerHTML="";
 if(n.type=="story"){s.innerHTML='<div class="speaker">'+n.speaker+'</div><div class="text">'+n.text+'</div>'+(n.thought?'<div class="thought">💭 '+n.thought+'</div>':'')+nextBtn()}
 if(n.type=="choice"){s.innerHTML='<div class="speaker">'+n.speaker+'</div><div class="question">'+n.q+'</div><div id="choices" class="choices"></div>';makeChoices(n.data.o)}
 if(n.type=="translate"){var cl=["s1","s2","s3","s4"][n.stage-1];s.innerHTML='<span class="stagepill '+cl+'">'+n.title+'</span><div class="question">'+n.q+'</div><div id="choices" class="choices"></div>';makeSimple(n)}
 if(n.type=="lesson"){s.innerHTML='<div class="lesson"><b>🌱 오늘의 마음 문장</b><p>'+n.lesson+'</p></div><div class="thought">관계는 상대의 마음을 맞히는 능력보다, 모르는 마음을 안전하게 물어볼 수 있는 용기에서 자랍니다.</div><div class="nextrow"><button class="btn primary" onclick="finish()">이 이야기 마치기</button></div>'}
}
function makeChoices(opts){var box=document.getElementById("choices");opts.forEach(function(o){var b=document.createElement("button");b.className="choice";b.textContent=o[0];b.onclick=function(){Array.from(box.children).forEach(function(x){x.disabled=true});b.classList.add("selected");if(o[3])score++;var d=document.createElement("div");d.className="feedback "+(o[3]?"good":"warn");d.innerHTML="<b>"+(o[3]?"관계를 여는 선택":"한 번 더 번역해 보기")+"</b><br>"+o[2]+'<div class="reply">상대의 반응: '+o[1]+"</div>"+nextBtn();box.after(d)};box.appendChild(b)})}
function makeSimple(n){var box=document.getElementById("choices");n.o.forEach(function(t,i){var b=document.createElement("button");b.className="choice";b.textContent=t;b.onclick=function(){Array.from(box.children).forEach(function(x){x.disabled=true});b.classList.add("selected");if(i==n.best)score++;var d=document.createElement("div");d.className="feedback "+(i==n.best?"good":"warn");d.innerHTML=(i==n.best?"좋아요. ":"조금 더 생각해 볼까요? ")+n.fb+nextBtn();box.after(d)};box.appendChild(b)})}
function nextBtn(){return '<div class="nextrow"><button class="btn primary" onclick="next()">계속 ▶</button></div>'}
function next(){if(pos<flow.length-1){pos++;render()}else finish()}
function finish(){show("result");var max=6;var msg=score>=5?"여러 가능성을 열어 두고 질문으로 확인하는 선택을 잘 했어요.":score>=3?"관계를 살리는 생각을 여러 번 선택했어요. 생활 속에서도 한 번 더 확인해 보세요.":"첫 생각이 사실인지 확인하는 연습을 조금 더 해 보면 좋아요.";document.getElementById("resultText").textContent=msg+" 중요한 것은 점수보다 ‘단정하지 않고 묻는 습관’입니다."}
function goHome(){stopMusic();show("home")}
function show(id){document.querySelectorAll(".screen").forEach(function(x){x.classList.remove("on")});document.getElementById(id).classList.add("on")}
document.getElementById("homeBtn").onclick=goHome;
document.getElementById("musicBtn").onclick=function(){music=!music;this.textContent=music?"♪ 음악 ON":"♪ 음악 OFF";if(music)startMusic();else stopMusic()};

function startMusic(){
 if(audio)return;var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC();var master=audio.createGain();master.gain.value=.055;master.connect(audio.destination);var chords=[[261.63,329.63,392],[220,277.18,329.63],[246.94,311.13,369.99],[196,246.94,293.66]];var step=0;
 function tone(freq,when,dur,type,vol){var o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.06);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g);g.connect(master);o.start(when);o.stop(when+dur+.1)}
 function loop(){if(!audio)return;var now=audio.currentTime+.05,c=chords[step%4];c.forEach(function(f){tone(f/2,now,3.5,"sine",.22)});tone(c[0]*2,now+.25,1.1,"triangle",.12);tone(c[1]*2,now+1.35,1,"triangle",.1);tone(c[2]*2,now+2.35,1,"triangle",.09);step++;timer=setTimeout(loop,3200)}var timer;loop();audio._timer=function(){clearTimeout(timer)}
}
function stopMusic(){if(audio){if(audio._timer)audio._timer();audio.close();audio=null}}
</script>
</body></html>
