<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마음번역소</title><style>html,body{margin:0;height:100%;background:#fff7ef;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}#loading{height:100%;display:grid;place-items:center;text-align:center;color:#6b4f3f;font-weight:700;font-size:20px}.dot{animation:b 1s infinite alternate}@keyframes b{to{opacity:.25}}</style></head><body><div id="loading">마음번역소를 여는 중<span class="dot">…</span></div><script>(async()=>{const files=["part-00.txt", "part-01.txt", "part-02.txt", "part-03.txt", "part-04.txt", "part-05.txt", "part-06.txt", "part-07.txt", "part-08.txt", "part-09.txt", "part-10.txt"];try{const texts=await Promise.all(files.map(f=>fetch(f,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error(f+" "+r.status);return r.text()})));const html=texts.join("");document.open();document.write(html);document.close()}catch(e){document.getElementById("loading").innerHTML="게임을 불러오지 못했어요.<br><small>새로고침해 주세요.</small>";console.error(e)}})();</script></body></html>
